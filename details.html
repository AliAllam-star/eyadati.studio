<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SEO Meta Tags -->
  <meta name="description" content="عيادتي ستوديو - قوالب مواقع احترافية للعيادات الطبية وطب الأسنان والجلدية والتجميل، جاهزة للتخصيص مع معاينة مباشرة.">
  <meta name="keywords" content="قوالب عيادات, قوالب مواقع طبية, تصميم مواقع عيادات أسنان, قوالب جلدية وتجميل">
  <meta name="author" content="Eyadati Studio">

  <!-- Open Graph (للمشاركة على السوشيال ميديا) -->
  <meta property="og:title" content="عيادتي ستوديو | قوالب مواقع العيادات">
  <meta property="og:description" content="قوالب مواقع عيادات متخصصة بتصميم احترافي وتجربة عربية متكاملة.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://yourwebsite.com/og-image.jpg"> <!-- حط رابط صورة اللوجو بتاعك هنا -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"> <!-- حط صورة أيقونة صغيرة في فولدر الموقع -->
<title>تفاصيل القالب | عيادتي ستوديو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --section-bg: #f7f9f8; --ink: #1f2937; --ink-soft: #4b5563; --muted: #6b7280; --line: #e5e7eb; --line-soft: #f3f4f6;
    --primary: #1e5b4a; --primary-hover: #154335; --accent: #2e8b6e; --accent-light: #e8f3ef;
    --radius-lg: 24px; --radius-md: 16px; --radius-sm: 12px;
    --shadow-md: 0 8px 24px -8px rgba(30,91,74,.12); --shadow-lg: 0 24px 48px -20px rgba(30,91,74,.18);
    --font-body: 'IBM Plex Sans Arabic', system-ui, sans-serif; --font-display: 'Tajawal', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--ink); line-height: 1.6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

  /* الهيدر */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); text-decoration: none; font-weight: 600; transition: color 0.2s; }
  .back-btn:hover { color: var(--primary); }

  /* التصميم الرئيسي */
  .template-details { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); }

  /* الصورة */
  .template-image { width: 100%; height: 100%; min-height: 400px; object-fit: cover; background: var(--section-bg); }

  /* المحتوى */
  .template-info { padding: 40px; display: flex; flex-direction: column; }
  .template-category { color: var(--muted); font-size: 14px; font-weight: 600; margin-bottom: 10px; display: block; }
  .template-title { font-family: var(--font-display); font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
  .template-desc { font-size: 16px; color: var(--ink-soft); margin-bottom: 25px; line-height: 1.8; }

  /* السعر */
  .price-box { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding: 20px; background: var(--section-bg); border-radius: var(--radius-md); }
  .price-main { font-size: 28px; font-weight: 800; color: var(--primary); font-family: var(--font-display); }
  .price-old { font-size: 16px; color: var(--muted); text-decoration: line-through; }

  /* المميزات */
  .features-list { list-style: none; margin-bottom: 40px; }
  .features-list li { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 15px; color: var(--ink); }
  .features-list svg { color: var(--primary); flex-shrink: 0; }

  /* الأزرار */
  .action-buttons { display: flex; gap: 15px; margin-top: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 100px; font-weight: 700; font-size: 15px; text-decoration: none; transition: all 0.2s; border: none; cursor: pointer; width: 100%; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px -8px rgba(30,91,74,.4); }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
  .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .btn-outline:hover { background: var(--accent-light); }

  @media (max-width: 768px) {
    .template-details { grid-template-columns: 1fr; }
    .template-image { min-height: 250px; }
    .template-info { padding: 24px; }
    .template-title { font-size: 24px; }
  }
</style>
</head>
<body>
<header style="max-width: 900px; margin: 20px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
  <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: var(--primary); text-decoration: none; font-weight: 800; font-size: 20px; font-family: var(--font-display);">
    <span style="width: 35px; height: 35px; background: var(--primary); color: #fff; border-radius: 10px; display: grid; place-items: center; font-size: 16px;">✳</span>
    عيادتي
  </a>

  <div style="display: flex; gap: 10px;">
    <!-- زرار الوضع الليلي -->
    <button id="themeToggle" aria-label="الوضع الليلي" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: 0.3s;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <!-- زرار اللغة -->
    <a href="index-en.html" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 13px; display: grid; place-items: center; transition: 0.3s;">
      EN
    </a>
  </div>
</header>
<div class="container">
  <div class="header">
    <a href="index.html" id="backBtn" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      العودة للقوالب
    </a>
  </div>

  <div class="template-details" id="templateDetails">
    <!-- سيتم ملء البيانات هنا بواسطة JavaScript -->
    <div style="padding: 40px; text-align: center; grid-column: 1/-1; color: var(--muted);">
      جاري تحميل التفاصيل...
    </div>
  </div>
</div>
<script>
  // 1. بنشوف إنت جاي من أنهي صفحة (عن طريق الـ referrer)
  const referrer = document.referrer;
  const isEnglish = referrer.includes('index-en.html');

  // 2. نظبط اتجاه الصفحة وزرار الرجوع بناءً على اللغة
  const backBtn = document.getElementById('backBtn');
  if (isEnglish) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.title = 'Template Details | Eyadati Studio';
    backBtn.innerHTML = '← Back to Templates';
    backBtn.href = 'index-en.html';
  } else {
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    document.title = 'تفاصيل القالب | عيادتي ستوديو';
    backBtn.innerHTML = '→ العودة للقوالب';
    backBtn.href = 'index.html';
  }

  // 3. بنجيب الـ ID بتاع القالب من الرابط
  const urlParams = new URLSearchParams(window.location.search);
  const templateId = urlParams.get('id');

  // 4. بنحمل ملف البيانات المناسب (بناءً على اللغة)
  const dataScript = document.createElement('script');
  dataScript.src = isEnglish ? 'data-en.js' : 'data-ar.js'; // تأكد إن اسم ملف العربي عندك صح

  dataScript.onload = () => {
    // 5. بنجيب البيانات من الملف
    const data = window.templatesData || (typeof templatesData !== 'undefined' ? templatesData : []);
    const template = data.find(t => t.id === templateId);
    const container = document.getElementById('templateDetails');

    if (!template) {
      container.innerHTML = `<div style="padding: 40px; text-align: center; grid-column: 1/-1; color: var(--muted);">${isEnglish ? 'Template not found.' : 'عذراً، هذا القالب غير موجود.'}</div>`;
      return;
    }

    // 6. تجهيز النصوص حسب اللغة
    const txt = isEnglish ? {
      currency: 'SAR',
      desc: `${template.subtitle}. This template is carefully designed to give your clinic the digital presence it deserves, with ease of customization to fit your clinic's identity.`,
      includes: 'What does the template include?',
      responsive: '100% Responsive Design',
      cleanCode: 'Clean & Easy to Modify Code (HTML/CSS/JS)',
      livePreview: 'Live Preview',
      buyNow: 'Buy Template Now',
      alertMsg: 'You will be redirected to checkout soon!'
    } : {
      currency: 'ر.س',
      desc: `${template.subtitle}. هذا القالب مصمم بعناية ليعطي عيادتك الحضور الرقمي الذي تستحقه، مع سهولة في التخصيص والتعديل ليتناسب مع هوية عيادتك.`,
      includes: 'ماذا يشمل القالب؟',
      responsive: 'تصميم متجاوب 100% مع جميع الشاشات',
      cleanCode: 'كود نظيف وسهل التعديل (HTML/CSS/JS)',
      livePreview: 'معاينة مباشرة',
      buyNow: 'شراء القالب الآن',
      alertMsg: 'سيتم توجيهك لصفحة الدفع قريباً!'
    };

    // 7. تجهيز الصورة والمميزات والسعر
    const imageHTML = template.imageUrl
      ? `<img src="${template.imageUrl}" alt="${template.name}" class="template-image">`
      : `<div class="template-image" style="background: var(--section-bg); display: grid; place-items: center; font-size: 40px;">✳</div>`;

    const featuresHTML = template.features.map(f => `
      <li>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        ${f}
      </li>
    `).join('');

    const oldPriceHTML = template.oldPrice ? `<span class="price-old">${template.oldPrice} ${txt.currency}</span>` : '';

    // 8. عرض المحتوى
    container.innerHTML = `
      ${imageHTML}
      <div class="template-info">
        <span class="template-category">${template.categoryLabel}</span>
        <h1 class="template-title">${template.name}</h1>
        <p class="template-desc">${txt.desc}</p>

        <div class="price-box">
          <span class="price-main">${template.price} ${txt.currency}</span>
          ${oldPriceHTML}
        </div>

        <h3 style="font-size: 18px; margin-bottom: 15px; color: var(--ink);">${txt.includes}</h3>
        <ul class="features-list">
          ${featuresHTML}
          <li>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            ${txt.responsive}
          </li>
          <li>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            ${txt.cleanCode}
          </li>
        </ul>

        <div class="action-buttons">
          <a href="${template.link}" target="_blank" class="btn btn-outline">${txt.livePreview}</a>
          <button class="btn btn-primary" onclick="alert('${txt.alertMsg}')">${txt.buyNow}</button>
        </div>
      </div>
    `;
  };

  document.body.appendChild(dataScript);
</script>
</body>
</html>
